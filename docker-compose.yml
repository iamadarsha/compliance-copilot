services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    # GROQ_API_KEY (and any SIMILARITY_THRESHOLD override) come from backend/.env.
    # Note: `environment:` below wins over `env_file:`, which is what we want for
    # DATABASE_URL (the container must reach postgres by service name, not localhost)
    # — so GROQ_API_KEY deliberately is NOT listed there.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://compliance:compliance@postgres:5432/compliance_copilot
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # Local-dev-only: live reload on source edits. The image's own default
    # CMD (no --reload, respects $PORT) is what ships to any real host.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
